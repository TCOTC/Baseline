[package]
name = "baseline-desktop"
version = "0.1.0"
edition = "2024"
description = "基线桌面外壳：用系统 WebView 承载内核渲染出的界面"
# 专有许可，非开源。条款见仓库根目录的 ../LICENSE。
license = "LicenseRef-Proprietary"
publish = false

[build-dependencies]
# 生成 Windows 资源与 capabilities 权限 schema。
tauri-build = { version = "2", features = [] }

[dependencies]
# 内核。判定规则、累积口径、渲染都在这里，外壳一个字都不重写。
baseline = { path = ".." }
# 只取默认特性：本外壳不调用任何 Tauri 插件，tray-icon / image 等都不需要。
tauri = { version = "2", features = [] }
anyhow = "1"
chrono = "0.4"
